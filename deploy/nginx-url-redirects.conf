# Optional nginx snippet for alec-website-static container.
# Mount or include in the container's default server block, then reload nginx.
#
# Goal: one canonical URL per page (.html) and fix legacy Astro paths.

# Core pages without .html → canonical .html
location = /about    { return 301 /about.html; }
location = /contact  { return 301 /contact.html; }
location = /blog     { return 301 /blog.html; }
location = /projects { return 301 /projects.html; }

# Trailing slashes and legacy paths
location = /thank-you/     { return 301 /thank-you.html; }
location = /privacy-policy { return 301 /privacy-policy.html; }
location = /services       { return 301 /; }
location = /docs           { return 301 /; }

# Project pages: trailing slash → .html
location ~ ^/projects/(.+)/$ {
    return 301 /projects/$1.html;
}

# Blog posts without .html → .html (if both currently serve 200)
location ~ ^/blog/([^/.]+)$ {
    return 301 /blog/$1.html;
}
