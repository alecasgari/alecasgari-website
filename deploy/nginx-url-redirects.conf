# Apply on the VPS nginx server block for alecasgari.com (NPM / container), then reload.
# Canonical host is apex HTTPS. One URL per page ending in .html.

# www → apex
if ($host = www.alecasgari.com) {
    return 301 https://alecasgari.com$request_uri;
}

# Core pages without .html
location = /about    { return 301 /about.html; }
location = /contact  { return 301 /contact.html; }
location = /blog     { return 301 /blog.html; }
location = /projects { return 301 /projects.html; }
location = /case-studies { return 301 /case-studies.html; }

# Trailing slashes on core pages (GSC still has /about/, /blog/, /thank-you/)
location = /about/    { return 301 /about.html; }
location = /contact/  { return 301 /contact.html; }
location = /blog/     { return 301 /blog.html; }
location = /projects/ { return 301 /projects.html; }
location = /case-studies/ { return 301 /case-studies.html; }
location = /thank-you/     { return 301 /thank-you.html; }
location = /thank-you      { return 301 /thank-you.html; }
location = /privacy-policy { return 301 /privacy-policy.html; }
location = /privacy-policy/ { return 301 /privacy-policy.html; }
location = /services       { return 301 /; }
location = /services/      { return 301 /; }
location = /docs           { return 301 /; }
location = /docs/          { return 301 /; }

# Retired admin (TinaCMS) — GSC still sees /admin
location = /admin { return 410; }
location = /admin/ { return 410; }

# Project + blog: extensionless and trailing slash → .html
location ~ ^/projects/(.+)/$ {
    return 301 /projects/$1.html;
}
location ~ ^/projects/([^/.]+)$ {
    return 301 /projects/$1.html;
}
location ~ ^/blog/(.+)/$ {
    return 301 /blog/$1.html;
}
location ~ ^/blog/([^/.]+)$ {
    return 301 /blog/$1.html;
}
location ~ ^/case-studies/(.+)/$ {
    return 301 /case-studies/$1.html;
}
location ~ ^/case-studies/([^/.]+)$ {
    return 301 /case-studies/$1.html;
}

# Calculator lives at calculator.alecasgari.com (canonical). Path on apex → subdomain.
location = /calculator { return 301 https://calculator.alecasgari.com/; }
location = /calculator/ { return 301 https://calculator.alecasgari.com/; }
location ~ ^/calculator/(.*)$ { return 301 https://calculator.alecasgari.com/$1; }

# Remaining project stubs with no restored body — send equity to the index
location = /projects/Automated-Blood-Glucose-Monitoring-and-Health-Tracking-Web-Platform.html { return 301 /projects.html; }
location = /projects/Automated-Webinar-Registration-and-Lead-Management-System.html { return 301 /projects.html; }
location = /projects/Brand-Identity-Design-for-Golden-Chain-Company.html { return 301 /projects.html; }
location = /projects/Comprehensive-BPMS-Implementation-for-Mashoon-Consulting.html { return 301 /projects.html; }
location = /projects/Custom-Data-Integration-for-Stonix-Systems.html { return 301 /projects.html; }
location = /projects/End-to-End-IPTV-Smart-Pro-Platform-Development-and-Integration.html { return 301 /projects.html; }
location = /projects/ERP-System-Integration-and-Workflow-Automation.html { return 301 /projects.html; }
location = /projects/IPTV-Smart-Solutions-Development-for-IPTV-Smarters-Pro-2026.html { return 301 /projects.html; }
