# calculator.alecasgari.com — serve in-repo calculator/ as document root
#
# Goal: one GitHub repo (alecasgari-website). Public URL stays
# https://calculator.alecasgari.com/ (SEO). Files live at:
#   /home/alecadmin/alecasgari-website/calculator/
#
# --- Option A (recommended): Nginx Proxy Manager ---
# 1. Proxy Host: calculator.alecasgari.com
# 2. Forward to the calculator static nginx container (alec-calculator-static:80)
# 3. Remount that container volume FROM:
#      /home/alecadmin/saas-calculator
#    TO:
#      /home/alecadmin/alecasgari-website/calculator
#    Then set env on deploy (optional): CALCULATOR_DIR=/home/alecadmin/alecasgari-website/calculator
#    so deploy.sh skips the legacy rsync copy.
# 4. SSL via Cloudflare or NPM certificate as you already use.
#
# --- Option B: raw nginx server block (if not using a separate container) ---
# server {
#     listen 80;
#     server_name calculator.alecasgari.com;
#     root /home/alecadmin/alecasgari-website/calculator;
#     index index.html;
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
# }
#
# Path on the main site (alecasgari.com/calculator/) should 301 to the subdomain.
# Those rules live in deploy/nginx-url-redirects.conf — apply on the MAIN site nginx.
