name: Deploy to VPS

on:
  push:
    branches: [main]

# Only one deploy at a time; extra pushes wait in queue (no parallel git pull on VPS).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/alecadmin/alecasgari-website
            bash deploy.sh
